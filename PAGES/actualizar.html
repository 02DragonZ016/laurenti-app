<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Stock - Laurenti App</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <header>
        <h1>Laurenti App</h1>
        <nav>
            <ul>
                <li><a href="dashboard.html">Volver al Dashboard</a></li>
                <li><a href="../index.html">Salir</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Actualizar Producto</h2>
            <p>Ingresá la nueva cantidad en stock.</p>
            
            <form id="form-actualizar">
                <fieldset>
                    <legend>Detalles del stock</legend>
                    
                    <!-- Usamos input type="number" como pide la consigna -->
                    <label for="cantidad">Nueva cantidad:</label>
                    <input type="number" id="cantidad" name="cantidad" min="0" required>
                    
                    <button type="submit" class="btn-guardar">Guardar Cambios</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Laurenti Quesos y Fiambres</p>
    </footer>

    <script src="../JS/main.js"></script>
</body>
</html>
