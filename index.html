<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laurenti App - Gestión de Stock</title>
    <!-- Enlace a la hoja de estilos base requerida -->
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
        <h1>Laurenti App</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="pages/dashboard.html">Dashboard</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Iniciar Sesión</h2>
            <p>Gestión rápida para el local de Av. Tucumán 601 / Av. Salta y Pasco</p>
            
            <!-- Formulario semántico sin usar divs innecesarios -->
            <form id="form-login">
                <fieldset>
                    <legend>Datos de acceso</legend>
                    
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>
                    
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                    
                    <button type="submit">Ingresar</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Laurenti Quesos y Fiambres</p>
    </footer>

    <!-- Enlace al script JS -->
    <script src="JS/main.js"></script>
</body>
</html>
